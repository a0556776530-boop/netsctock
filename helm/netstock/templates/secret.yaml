{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "netstock.fullname" . }}
  labels:
    {{- include "netstock.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_URI: {{ .Values.secret.mongoUri | quote }}
  SECRET_KEY: {{ .Values.secret.secretKey | quote }}
{{- end }}
