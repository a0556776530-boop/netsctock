<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetStock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1623;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, 0.58);
      z-index: 1;
    }

    .ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ── Logo ── */
    .logo-img {
      width: 200px;
      max-width: 60vw;
      animation: fadeUp 0.7s ease forwards, glow 2.5s ease-in-out 0.7s infinite;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.35)); }
      50%       { filter: drop-shadow(0 0 44px rgba(0, 212, 255, 0.7)); }
    }

    /* ── Headline ── */
    .headline {
      margin-top: 28px;
      color: #ffffff;
      font-size: clamp(1rem, 4vw, 1.45rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeUp 0.6s ease 0.9s forwards;
    }

    /* ── Typewriter subtitle ── */
    .subtitle {
      margin-top: 10px;
      color: #00d4ff;
      font-size: clamp(0.68rem, 2.2vw, 0.85rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      font-style: italic;
      min-height: 1.4em;
      direction: ltr;
      unicode-bidi: bidi-override;
    }

    /* cursor blink */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 0.9em;
      background: #00d4ff;
      margin-left: 2px;
      vertical-align: middle;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ── Divider ── */
    .divider {
      margin-top: 32px;
      width: 40px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
      opacity: 0;
      animation: fadeUp 0.5s ease 1.8s forwards;
    }

    /* ── Progress bar ── */
    .progress-wrap {
      margin-top: 28px;
      width: 200px;
      height: 2px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.5s ease 2s forwards;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #6366f1);
      border-radius: 99px;
      animation: progress 5s ease-in-out 2.1s forwards;
      box-shadow: 0 0 8px rgba(0, 212, 255, 0.5);
    }

    @keyframes progress {
      0%   { width: 0%; }
      35%  { width: 60%; }
      75%  { width: 82%; }
      100% { width: 91%; }
    }

    .status {
      margin-top: 16px;
      color: rgba(255,255,255,0.35);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeUp 0.5s ease 2.2s forwards;
    }
  </style>
</head>
<body>

  <video class="video-bg" autoplay muted loop playsinline preload="auto"
         poster="/static/video/poster.jpg">
    <source src="/static/video/intro.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <div class="ui">
    <img src="/static/img/logo.png" alt="NetStock" class="logo-img">

    <div class="headline">Network Asset Control</div>

    <div class="subtitle" id="subtitle"><span class="cursor"></span></div>

    <div class="divider"></div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status" id="status">מתחבר…</div>
  </div>

  <script>
    // ── Typewriter ────────────────────────────────────────────────────────────
    var TEXT    = 'From procurement to deployment — every asset, accounted for.';
    var subtitleEl = document.getElementById('subtitle');
    var typed   = '';
    var i       = 0;
    var DELAY   = 1500; // ms before typing starts
    var SPEED   = 38;   // ms per character

    function typeNext() {
      if (i < TEXT.length) {
        typed += TEXT[i++];
        subtitleEl.innerHTML = typed + '<span class="cursor"></span>';
        setTimeout(typeNext, SPEED);
      } else {
        // Keep cursor blinking for 1.5s then fade it out
        setTimeout(function() {
          var cur = subtitleEl.querySelector('.cursor');
          if (cur) { cur.style.transition = 'opacity 0.4s'; cur.style.opacity = '0'; }
        }, 1500);
      }
    }

    setTimeout(typeNext, DELAY);

    // ── Ping ─────────────────────────────────────────────────────────────────
    var attempts = 0;

    function check() {
      attempts++;
      fetch('/api/ping', { credentials: 'include', cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            window.location.href = '/?ready=1';
          } else if (r.status === 401 || r.status === 302) {
            window.location.href = '/auth/login';
          } else {
            retry();
          }
        })
        .catch(function() { retry(); });
    }

    function retry() {
      setTimeout(check, attempts > 30 ? 4000 : 1500);
    }

    setTimeout(check, 800);
  </script>
</body>
</html>
