<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetStock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Animated background particles */
    .bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(0, 212, 255, 0.06);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      z-index: 1;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-img {
      width: 200px;
      max-width: 60vw;
      filter: drop-shadow(0 0 24px rgba(0, 212, 255, 0.35));
      animation: glow 2.5s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.3)); }
      50%       { filter: drop-shadow(0 0 40px rgba(0, 212, 255, 0.65)); }
    }

    .tagline {
      color: #00d4ff;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      font-weight: 500;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 48px;
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      z-index: 1;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #6366f1);
      border-radius: 99px;
      animation: progress 4s ease-in-out forwards;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
    }

    @keyframes progress {
      0%   { width: 0%; }
      40%  { width: 65%; }
      80%  { width: 85%; }
      100% { width: 92%; }
    }

    .status {
      margin-top: 20px;
      color: rgba(255,255,255,0.3);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>

  <!-- Floating particles -->
  <div class="bg" id="bg"></div>

  <!-- Logo -->
  <div class="logo-wrap">
    <img src="/static/img/logo.png" alt="NetStock" class="logo-img">
    <div class="tagline">Track · Optimize · Scale</div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-bar"></div>
  </div>
  <div class="status" id="status">מתחבר…</div>

  <script>
    // Generate particles
    var bg = document.getElementById('bg');
    for (var i = 0; i < 18; i++) {
      var p = document.createElement('div');
      p.className = 'particle';
      var size = 20 + Math.random() * 80;
      p.style.cssText = [
        'width:' + size + 'px',
        'height:' + size + 'px',
        'left:' + Math.random() * 100 + '%',
        'animation-duration:' + (8 + Math.random() * 14) + 's',
        'animation-delay:' + (Math.random() * 10) + 's',
      ].join(';');
      bg.appendChild(p);
    }

    // Poll server until ready, then redirect
    var attempts = 0;
    var statusEl = document.getElementById('status');

    function check() {
      attempts++;
      fetch('/api/ping', { credentials: 'include', cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            statusEl.textContent = 'מוכן!';
            setTimeout(function() { window.location.href = '/?ready=1'; }, 200);
          } else if (r.status === 401 || r.status === 302) {
            window.location.href = '/auth/login';
          } else {
            retry();
          }
        })
        .catch(function() { retry(); });
    }

    function retry() {
      if (attempts > 30) {
        statusEl.textContent = 'בעיית חיבור — מנסה שוב…';
        setTimeout(check, 4000);
      } else {
        if (attempts > 5) statusEl.textContent = 'השרת מתעורר, רגע…';
        setTimeout(check, 1500);
      }
    }

    // Start checking after a moment
    setTimeout(check, 800);
  </script>
</body>
</html>
