<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetStock</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1623;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* Fullscreen video background */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Dark overlay so text stays readable */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 15, 30, 0.52);
      z-index: 1;
    }

    /* All UI sits above video */
    .ui {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo */
    .logo-img {
      width: 200px;
      max-width: 60vw;
      filter: drop-shadow(0 0 24px rgba(0, 212, 255, 0.45));
      animation: fadeIn 0.6s ease, glow 2.5s ease-in-out 0.6s infinite;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 212, 255, 0.35)); }
      50%       { filter: drop-shadow(0 0 44px rgba(0, 212, 255, 0.7)); }
    }

    .tagline {
      color: #00d4ff;
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      font-weight: 500;
      margin-top: 8px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 0.6s ease 0.3s forwards;
    }

    /* Progress bar */
    .progress-wrap {
      margin-top: 52px;
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00d4ff, #6366f1);
      border-radius: 99px;
      animation: progress 4s ease-in-out forwards;
      box-shadow: 0 0 10px rgba(0, 212, 255, 0.6);
    }

    @keyframes progress {
      0%   { width: 0%; }
      40%  { width: 65%; }
      80%  { width: 85%; }
      100% { width: 92%; }
    }

    .status {
      margin-top: 18px;
      color: rgba(255,255,255,0.5);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
    }
  </style>
</head>
<body>

  <!-- Video background -->
  <video class="video-bg" autoplay muted loop playsinline preload="auto"
         poster="/static/video/poster.jpg">
    <source src="/static/video/intro.mp4" type="video/mp4">
  </video>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- UI overlay -->
  <div class="ui">
    <img src="/static/img/logo.png" alt="NetStock" class="logo-img">
    <div class="tagline">Track · Optimize · Scale</div>

    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status" id="status">מתחבר…</div>
  </div>

  <script>
    var attempts = 0;

    function check() {
      attempts++;
      fetch('/api/ping', { credentials: 'include', cache: 'no-store' })
        .then(function(r) {
          if (r.ok) {
            window.location.href = '/?ready=1';
          } else if (r.status === 401 || r.status === 302) {
            window.location.href = '/auth/login';
          } else {
            retry();
          }
        })
        .catch(function() { retry(); });
    }

    function retry() {
      setTimeout(check, attempts > 30 ? 4000 : 1500);
    }

    setTimeout(check, 800);
  </script>
</body>
</html>
