<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir_html }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NetStock{% endblock %} — {{ t.app_subtitle }}</title>
  {% if lang == 'he' %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" />
  {% else %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  {% endif %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #0a0f1e;
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
    }

    /* ── Animated background ── */
    .bg-scene {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(59,130,246,.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(99,102,241,.14) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 60% 40%, rgba(16,185,129,.07) 0%, transparent 60%),
        #0a0f1e;
    }
    .bg-scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.04) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    /* ── Floating orbs ── */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      animation: drift 12s ease-in-out infinite alternate;
      pointer-events: none;
    }
    .orb-1 { width:420px; height:420px; background:rgba(59,130,246,.12); top:-120px; left:-100px; animation-delay:0s; }
    .orb-2 { width:320px; height:320px; background:rgba(99,102,241,.10); bottom:-80px; right:-80px; animation-delay:-4s; }
    .orb-3 { width:200px; height:200px; background:rgba(16,185,129,.08); top:50%; right:15%; animation-delay:-8s; }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(30px, -20px) scale(1.06); }
    }

    /* ── Card ── */
    .login-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: rgba(255,255,255,.035);
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 20px;
      padding: 2.8rem 2.5rem 2.5rem;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 32px 64px rgba(0,0,0,.5),
        0 8px 24px rgba(0,0,0,.3);
      animation: cardIn .5s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translateY(24px) scale(.97); }
      to   { opacity:1; transform: translateY(0) scale(1); }
    }

    /* ── Brand ── */
    .brand-icon {
      width: 60px; height: 60px;
      border-radius: 16px;
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
      color: #fff;
      box-shadow: 0 8px 24px rgba(59,130,246,.4), 0 0 0 1px rgba(255,255,255,.15) inset;
      margin: 0 auto 1.2rem;
    }
    .brand-name {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -.02em;
      margin: 0 0 .25rem;
    }
    .brand-sub {
      font-size: .82rem;
      color: rgba(255,255,255,.38);
      margin: 0;
    }

    /* ── Form labels ── */
    .form-label {
      color: rgba(255,255,255,.65);
      font-size: .8rem;
      font-weight: 500;
      letter-spacing: .02em;
      text-transform: uppercase;
      margin-bottom: .45rem;
    }

    /* ── Inputs ── */
    .form-control {
      background: rgba(255,255,255,.06) !important;
      border: 1px solid rgba(255,255,255,.1) !important;
      border-radius: 10px !important;
      color: #f1f5f9 !important;
      font-size: .92rem;
      padding: .65rem .95rem;
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    .form-control::placeholder { color: rgba(255,255,255,.22) !important; }
    .form-control:focus {
      background: rgba(255,255,255,.09) !important;
      border-color: rgba(59,130,246,.7) !important;
      box-shadow: 0 0 0 3px rgba(59,130,246,.18) !important;
      outline: none;
    }
    .form-control.is-invalid {
      border-color: rgba(239,68,68,.6) !important;
      box-shadow: 0 0 0 3px rgba(239,68,68,.12) !important;
    }
    .invalid-feedback { color: #f87171; font-size: .78rem; margin-top: .3rem; }

    /* ── Password wrapper ── */
    .pw-wrap { position: relative; }
    .pw-wrap .form-control { padding-inline-end: 2.8rem; }
    .pw-eye {
      position: absolute;
      inset-block: 0;
      inset-inline-end: .1rem;
      width: 2.6rem;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,.3);
      cursor: pointer;
      background: none; border: none;
      transition: color .15s;
      font-size: 1rem;
    }
    .pw-eye:hover { color: rgba(255,255,255,.7); }

    /* ── Remember me ── */
    .form-check-input {
      background-color: rgba(255,255,255,.08) !important;
      border-color: rgba(255,255,255,.18) !important;
      cursor: pointer;
    }
    .form-check-input:checked {
      background-color: #3b82f6 !important;
      border-color: #3b82f6 !important;
    }
    .form-check-label {
      color: rgba(255,255,255,.5);
      font-size: .83rem;
      cursor: pointer;
    }

    /* ── Submit button ── */
    .btn-login {
      background: linear-gradient(135deg, #1d4ed8 0%, #3b82f6 100%);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      letter-spacing: .01em;
      padding: .72rem;
      width: 100%;
      transition: opacity .15s, transform .12s, box-shadow .15s;
      box-shadow: 0 4px 16px rgba(59,130,246,.35);
    }
    .btn-login:hover  { opacity:.9; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(59,130,246,.4); color:#fff; }
    .btn-login:active { transform: translateY(0); }

    /* ── Flash messages ── */
    .flash-wrap {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      min-width: 340px;
    }
    .alert {
      border-radius: 10px;
      font-size: .85rem;
      backdrop-filter: blur(12px);
    }

    /* ── Footer note ── */
    .login-footer {
      text-align: center;
      color: rgba(255,255,255,.18);
      font-size: .74rem;
      margin-top: 2rem;
    }
    .divider {
      border: none;
      height: 1px;
      background: rgba(255,255,255,.07);
      margin: 1.6rem 0;
    }
  </style>
</head>
<body>

<div class="bg-scene"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="orb orb-3"></div>

<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show shadow" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
</div>

<div class="login-wrap">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
